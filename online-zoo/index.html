<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>online-zoo</title>
    <link rel="stylesheet" href="./src/styles/style.css" />
  </head>
  <body>
    <header>
      <div class="container header__container">
        <h1 class="header__title">
          <svg viewBox="0 0 96 50">
            <use href="/icon.svg#logo"></use>
          </svg>
          <span class="header__hidden">online-zoo</span>
        </h1>
        <button class="header__burger-menu">
          <span class="header__burger-menu_line"></span>
          <span class="header__burger-menu_line"></span>
          <span class="header__burger-menu_line"></span>
          <span class="header__burger-menu_line_cross"></span>
          <span class="header__burger-menu_line_cross"></span>
        </button>
        <div class="header__right-block">
          <nav class="header__navigation">
            <a href="#" class="header__navigation_item header__navigation_item_active">About</a>
            <a href="./map.html" class="header__navigation_item">Map</a>
            <a href="./zoos.html" class="header__navigation_item">Zoos</a>
            <a href="./contact.html" class="header__navigation_item">Contact us</a>
            <a href="#" class="header__navigation_item">Design</a>
          </nav>
          <nav class="header__social">
            <a href="https://www.youtube.com" class="header__social_item">
              <img src="/images/youtube.png" alt="Youtube link" />
            </a>
            <a href="https://www.instagram.com" class="header__social_item">
              <img src="/images/instagram.png" alt="Instagram link" />
            </a>
            <a href="https://www.facebook.com" class="header__social_item">
              <img src="/images/facebook.png" alt="Facebook link" />
            </a>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="container watch__container">
        <h2 class="watch__title">Watch your favorite animal online</h2>
        <p class="watch__text">Explore the exciting and mysterious world of wild animals in a natural setting without leaving your home.</p>
        <button class="watch__button">
          <span class="watch__button_text">View live cam</span>
          <svg width="25" height="22" viewBox="0 0 25 22">
            <use href="/icon.svg#arrow"></use>
          </svg>
        </button>
      </section>
      <section class="welcome"></section>
      <section class="meet"></section>
    </main>
    <footer></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/../src/features/burger-menu.js"></script>
  </body>
</html>
